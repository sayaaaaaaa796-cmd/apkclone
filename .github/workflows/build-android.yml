name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Cari APK di repo
        run: |
          echo "=== MENCARI FILE APK ==="
          find . -name "*.apk" -type f || echo "Tidak ada APK ditemukan"
          echo ""
          echo "=== ISI REPO ==="
          ls -la

      - name: Upload APK (Kalau Ada)
        uses: actions/upload-artifact@v4
        with:
          name: File-APK
          path: |
            **/*.apk
            *.apk
            app/**/*.apk