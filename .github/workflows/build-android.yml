name: Auto Fix Code

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  fix-code:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          npm install --global prettier eslint
          pip install black isort autopep8 -q

      - name: Fix code
        run: |
          # JavaScript
          npx prettier --write . --ignore-unknown 2>/dev/null || true
          npx eslint . --fix 2>/dev/null || true
          
          # Python
          black . -q 2>/dev/null || true
          isort . -q 2>/dev/null || true
          autopep8 --in-place --recursive . 2>/dev/null || true

      - name: Auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 chore: auto-fix formatting & linting"
          file_pattern: "."