name: Auto Fix Code Formatting & Linting

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  fix-code:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Setup berbagai bahasa pemrograman
      - name: Setup Node.js (JavaScript/TypeScript)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install semua formatter & linter tools
      - name: Install formatters and linters
        run: |
          # Node.js tools
          npm install --global prettier eslint
          
          # Python tools
          pip install black isort autopep8 flake8
          
          # Go (optional)
          go install golang.org/x/tools/cmd/goimports@latest
          
          # PHP (optional)
          # composer global require squizlabs/php_codesniffer

      # JavaScript/TypeScript formatting
      - name: Fix JavaScript/TypeScript
        run: |
          npx prettier --write "**/*.{js,jsx,ts,tsx,json,md,yaml,yml}" --ignore-path .gitignore || true
          npx eslint . --fix --ignore-path .gitignore || true

      # Python formatting
      - name: Fix Python code
        run: |
          black . --quiet || true
          isort . --quiet || true
          autopep8 --in-place --recursive . || true

      # Go formatting (jika ada file .go)
      - name: Fix Go code
        run: |
          if find . -name "*.go" -type f | grep -q .; then
            go fmt ./...
            goimports -w . || true
          fi

      # PHP formatting (opsional)
      # - name: Fix PHP code
      #   run: |
      #     if command -v phpcbf &> /dev/null; then
      #       phpcbf . || true
      #     fi

      # Check apakah ada perubahan
      - name: Check if there are changes
        id: verify-changed-files
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Auto-commit & push jika ada perubahan
      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "🤖 chore: auto-fix code formatting & linting" || true
          git push