name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun pake npm
        run: |
          npm install -g bun
          bun --version

      - name: Install Dependencies
        run: bun install

      - name: Build Web
        run: bun run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Buat Project Capacitor
        run: |
          npx cap init MyApp com.example.myapp --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Fix Duplicate Class Error
        run: |
          cd android
          echo "" >> app/build.gradle
          echo "configurations.all {" >> app/build.gradle
          echo "    resolutionStrategy {" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'" >> app/build.gradle
          echo "    }" >> app/build.gradle
          echo "}" >> app/build.gradle
          echo "=== isi build.gradle ==="
          cat app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: File-APK
          path: android/app/build/outputs/apk/debug/*.apk